<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大頭教練・學員管理</title>
<meta name="description" content="大頭教練私人學員管理：堂數、課堂紀錄、改期、LINE 提醒。資料存在你自己的瀏覽器。">
<meta name="theme-color" content="#A8721B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大頭教練">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  color-scheme:light;
  --paper:#FBF9F6;--surface:#fff;--surface-2:#F4F0E9;--ink:#221D16;--ink-2:#5C5348;--muted:#8A8074;
  --line:#E7E1D8;--line-2:#D6CEC2;--gold:#A8721B;--gold-soft:rgba(168,114,27,.10);--gold-line:rgba(168,114,27,.35);
  --good:#15803D;--good-soft:rgba(21,128,61,.10);--warn:#B45309;--warn-soft:rgba(180,83,9,.10);
  --crit:#BE123C;--crit-soft:rgba(190,18,60,.10);--info:#2563EB;--info-soft:rgba(37,99,235,.10);
  --on-gold:#fff;--shadow:0 1px 2px rgba(34,29,22,.05),0 8px 24px -16px rgba(34,29,22,.25);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#14110D;--surface:#1D1913;--surface-2:#262019;--ink:#F2ECE3;--ink-2:#C6BCAE;--muted:#9A9083;
  --line:#2E2820;--line-2:#3D3529;--gold:#E4A94A;--gold-soft:rgba(228,169,74,.12);--gold-line:rgba(228,169,74,.38);
  --good:#5CD98A;--good-soft:rgba(92,217,138,.12);--warn:#FB923C;--warn-soft:rgba(251,146,60,.12);
  --crit:#FB7185;--crit-soft:rgba(251,113,133,.12);--info:#6BA6FF;--info-soft:rgba(107,166,255,.12);
  --on-gold:#17130C;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.app{display:flex;min-height:100vh}
.rail{width:200px;flex:0 0 200px;border-right:1px solid var(--line);background:var(--surface);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{padding:4px 10px 16px}.brand b{display:block;font-size:16px}.brand small{color:var(--muted);font-size:11px;letter-spacing:.06em}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);cursor:pointer;text-align:left;position:relative}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--gold-soft);color:var(--gold);font-weight:600}
.nav-btn .badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
main{flex:1;min-width:0;padding:24px 22px 96px}
.wrap{max-width:900px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-title{font-size:22px;font-weight:700;margin:0}.page-sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar .nav-btn{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;justify-content:center;text-align:center}
.tabbar .nav-btn .badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0}
@media(max-width:820px){.rail{display:none}.tabbar{display:flex}main{padding:16px 14px 100px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-title{font-size:15px;font-weight:650;margin:0}.sec-sub{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:104px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);text-align:left}
button.tile{cursor:pointer}button.tile:hover{border-color:var(--gold-line)}
.tile-value{font:600 25px/1.15 var(--mono);font-variant-numeric:tabular-nums}.tile-unit{font:12px var(--sans);color:var(--muted);margin-left:2px}
.tile-label{font-size:12.5px;color:var(--ink-2)}.tile-note{font-size:11px;color:var(--muted);margin-top:auto;min-height:1.4em}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}.btn-primary:hover{background:var(--gold);filter:brightness(1.06)}
.btn-line{background:#06C755;border-color:#06C755;color:#fff;font-weight:600}.btn-line:hover{background:#06C755;filter:brightness(1.05)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-danger{color:var(--crit)}.btn-danger:hover{background:var(--crit-soft)}
.btn-sm{padding:4px 10px;font-size:12.5px}
.btn-plain{border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:550;white-space:nowrap}
.pill-good{background:var(--good-soft);color:var(--good)}.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-crit{background:var(--crit-soft);color:var(--crit)}.pill-info{background:var(--info-soft);color:var(--info)}
.pill-gold{background:var(--gold-soft);color:var(--gold)}.pill-mute{background:var(--surface-2);color:var(--muted)}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.row-main{min-width:0;flex:1}.row-title{font-weight:550;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-sub{font-size:12px;color:var(--muted)}.qbtns{display:flex;gap:6px}.row-end{flex:none;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.empty{color:var(--muted);font-size:13px;padding:20px 4px;text-align:center}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.muted{color:var(--muted)}
.hint{font-size:12px;line-height:1.6;color:var(--muted);margin:6px 0}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}.field>label{font-size:12.5px;color:var(--ink-2);font-weight:550}
.field .hint{margin:0;font-size:11.5px}
input[type=text],input[type=tel],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:8px 11px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:66px;resize:vertical}
@media (max-width:820px){input[type=text],input[type=tel],input[type=search],input[type=number],input[type=date],input[type=time],input[type=email],input[type=url],select,textarea,.msg{font-size:16px}}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:520px){.field-row{grid-template-columns:1fr}}
.wdchips{display:flex;gap:6px;flex-wrap:wrap}.wdchips label{cursor:pointer}.wdchips input{position:absolute;opacity:0;pointer-events:none}
.wdchips span{display:inline-block;min-width:38px;text-align:center;padding:7px 0;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--surface);color:var(--ink-2)}
.wdchips input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.wdchips input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.dayprev{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin:6px 0}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:24px;background:var(--surface);border-radius:50%}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;line-height:1.15}
.donut-c b{font-size:26px;font-weight:700}.donut-c span{font-size:12px;color:var(--muted)}
.legend{flex:1 1 170px;min-width:160px}
.legend-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px;color:var(--ink-2)}
.legend-row .sw{width:10px;height:10px;border-radius:3px;flex:none}.legend-row .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink)}
.legend-row .pc{width:42px;text-align:right;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.bar-row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13px;color:var(--ink-2)}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--gold);border-radius:0 4px 4px 0}.bar b{display:block;height:100%;background:var(--gold-line)}
.bar-row .v{font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;min-width:64px}
.delta{font-size:12px}.delta.up{color:var(--good)}.delta.down{color:var(--crit)}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:10px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:transparent;color:var(--ink-2);padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-2)}
.day:hover{background:var(--surface-2)}.day[aria-pressed=true]{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
.day-name{font-size:10.5px;color:var(--muted)}.day-num{font:15px var(--mono)}
.day.today .day-num{background:var(--gold);color:var(--on-gold);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.day-dots{display:flex;gap:3px;height:6px;align-items:center}.day-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.7}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(20,17,13,.45);display:grid;place-items:center;padding:20px}
@media(max-width:699px){.scrim{place-items:end center;padding:0}}
dialog.sheet{position:relative;border:0;padding:0;margin:0;width:100%;max-width:560px;max-height:90vh;background:var(--surface);color:var(--ink);border-radius:18px;box-shadow:0 -8px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
@media(max-width:699px){dialog.sheet{border-radius:18px 18px 0 0}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet-title{font-weight:650;font-size:15.5px}
.sheet-body{padding:16px;overflow-y:auto}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:84px;z-index:90;transform:translate(-50%,12px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.note-box{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--ink-2)}
.ex-row{display:grid;grid-template-columns:1fr 62px 46px 46px 30px;gap:6px;margin-bottom:6px}
.ex-row input{padding:7px 8px}
.msg{width:100%;min-height:120px;font-size:14px;line-height:1.6}
.hist summary{cursor:pointer;list-style:none}.hist summary::-webkit-details-marker{display:none}
.hist{border-bottom:1px solid var(--line);padding:9px 0}.hist:last-child{border-bottom:0}
.hist-body{margin:8px 0 2px 20px;font-size:13px;color:var(--ink-2);white-space:pre-wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin:8px 0}.kv dt{color:var(--muted)}.kv dd{margin:0}
.big-remain{font:700 34px/1 var(--mono)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.divider{height:1px;background:var(--line);margin:8px 0}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="主選單">
    <div class="brand"><b>大頭教練</b><small>私人學員管理</small></div>
    <div id="nav-main"></div>
  </nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="主選單"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="dl-ex"></datalist>

<script>
"use strict";
const BUILD = "2026-10-13 · v7.2";
const KEY = "dtc-pt-v1";

/* ───────── 預設值 ───────── */
const DEFAULT_TEMPLATES = {
  confirm: "{name} 你好 👋\n已幫你預約好囉：\n📅 {date}（{weekday}）{time}\n📍 {studio}\n目前剩餘 {remaining} 堂\n有任何問題隨時跟我說！",
  remind:  "{name} 你好～提醒你{when}（{date} {weekday}）{time} 有課 💪\n記得補充水分、穿好運動服。\n要請假請提前跟我說喔！\n— {coach}",
  change:  "{name} 你好，課程時間有更動：\n❌ 原本：{oldDate}（{oldWeekday}）{oldTime}\n✅ 改成：{date}（{weekday}）{time}\n如果這個時間不方便再跟我說，謝謝！\n— {coach}",
  low:     "{name} 你好，目前剩下 {remaining} 堂課囉 🙌\n想續課的話跟我說，我幫你安排～\n— {coach}",
};
const DEFAULT_SETTINGS = {
  studio: "大頭教練愛運動", coach: "大頭教練", duration: 60, lowAt: 3,
  absentConsumes: false, theme: "auto", templates: { ...DEFAULT_TEMPLATES },
};
const COLORS = ["#A8721B","#2563EB","#15803D","#BE123C","#7C3AED","#0F766E","#C2410C","#4338CA"];
const KINDS = {
  private:{label:"私人課",color:"#A8721B"}, group:{label:"團體課",color:"#2563EB"},
  school:{label:"樹德科大",color:"#7C3AED"}, other:{label:"其他",color:"#64748B"},
};
const STATUS = {
  scheduled:{label:"已排定",pill:"info"}, attended:{label:"已出席",pill:"good"},
  late:{label:"遲到",pill:"warn"}, absent:{label:"缺席",pill:"crit"}, cancelled:{label:"已取消",pill:"mute"},
};

/* ───────── 工具 ───────── */
const pad = n => String(n).padStart(2,"0");
const dayStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dayStr(new Date());
function parseDay(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null}
const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const startOfWeek = d=>addDays(d,-((d.getDay()+6)%7));
const WD = ["日","一","二","三","四","五","六"];
const wdName = ds=>{const d=parseDay(ds);return d?"週"+WD[d.getDay()]:""};
const mdLabel = ds=>{const d=parseDay(ds);return d?`${d.getMonth()+1}/${d.getDate()}`:ds};
const fmtDate = ds=>`${mdLabel(ds)}（${wdName(ds)}）`;
const minutesOf = t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||"");return m?+m[1]*60+ +m[2]:0};
const timeOf = m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const money = n=>"$"+Math.round(n||0).toLocaleString("en-US");
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
// id 一律用字串比較（onclick／dataset 傳出來都是字串）
const byId = (arr,id)=>arr.find(x=>String(x.id)===String(id))||null;
const clone = o=>JSON.parse(JSON.stringify(o));
const nameCollator = new Intl.Collator("zh-Hant-u-co-stroke",{numeric:true});
const cmpLesson = (a,b)=>(a.date+a.start).localeCompare(b.date+b.start);
const isPast = l=>new Date(`${l.date}T${l.end}:00`)<new Date();

/* ───────── 資料 ───────── */
let S = load() || blank();
function blank(){return {students:[],lessons:[],settings:clone(DEFAULT_SETTINGS)}}
function load(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw) return null;
    return normalize(JSON.parse(raw));
  }catch(e){console.warn("讀取失敗",e);return null}
}
function normalize(p){
  if(!p||typeof p!=="object") throw new Error("格式不正確");
  const st = {...clone(DEFAULT_SETTINGS), ...(p.settings||{})};
  st.templates = {...DEFAULT_TEMPLATES, ...((p.settings||{}).templates||{})};
  return {
    settings: st,
    students: (Array.isArray(p.students)?p.students:[]).map(s=>({
      id:String(s.id||uid()), name:s.name||"", phone:s.phone||"", lineName:s.lineName||"", lineUserId:s.lineUserId||"",
      rate:+s.rate||0, note:s.note||"", packs:s.packs!==false, color:s.color||COLORS[0], status:s.status||"active",
      remaining:+s.remaining||0, totalPurchased:+s.totalPurchased||0,
      purchases:Array.isArray(s.purchases)?s.purchases:[],
      lowNotifiedAt:s.lowNotifiedAt||"", lowNotifiedRemaining:s.lowNotifiedRemaining??null,
      demo:!!s.demo, createdAt:s.createdAt||new Date().toISOString(),
    })),
    lessons: (Array.isArray(p.lessons)?p.lessons:[]).map(l=>({
      id:String(l.id||uid()), studentId:String(l.studentId||""), date:l.date||"", start:l.start||"09:00", end:l.end||"10:00",
      status:STATUS[l.status]?l.status:"scheduled", consumed:!!l.consumed,
      kind:KINDS[l.kind]?l.kind:"private", title:l.title||"",
      amount:(l.amount===null||l.amount===undefined||l.amount==="")?null:(+l.amount||0),
      log:{focus:"",exercises:[],feeling:"",coachNote:"",next:"",...(l.log||{})},
      changes:Array.isArray(l.changes)?l.changes:[],
      gcalId:l.gcalId||"", gcalSig:l.gcalSig||"", gcalAt:l.gcalAt||"",
      confirmedAt:l.confirmedAt||"", remindedAt:l.remindedAt||"", changeNotifiedAt:l.changeNotifiedAt||"",
      createdAt:l.createdAt||new Date().toISOString(),
    })),
  };
}
let saveFailed=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));saveFailed=false}
  catch(e){if(!saveFailed){saveFailed=true;toast("存不進瀏覽器空間，請先匯出備份")}}
  if(typeof fbSchedule==="function")fbSchedule();
}
function commit(){save();render();if(typeof gcSchedule==="function")gcSchedule()}

/* ───────── 領域邏輯 ───────── */
const studentById = id=>byId(S.students,id);
const lessonById = id=>byId(S.lessons,id);
const onRoster = s=>s.status!=="archived";
const activeStudents = ()=>S.students.filter(onRoster).sort((a,b)=>nameCollator.compare(a.name,b.name));
const lessonsOf = sid=>S.lessons.filter(l=>String(l.studentId)===String(sid)).sort(cmpLesson);
const consumes = status=>status==="attended"||status==="late"||(status==="absent"&&S.settings.absentConsumes);

/** 改狀態並同步扣／還堂數。consumed 旗標讓狀態來回切換也不會重複扣。
 *  剩餘可以變負數：代表「上了但還沒買」，續課時自然抵銷。 */
function setLessonStatus(l,status){
  const st=studentById(l.studentId), should=consumes(status);
  if(st){
    if(should&&!l.consumed&&st.packs!==false){st.remaining-=1;l.consumed=true}
    else if(!should&&l.consumed){st.remaining+=1;l.consumed=false}
  }
  l.status=status;
}
function releaseLesson(l){
  const st=studentById(l.studentId);
  if(st&&l.consumed) st.remaining+=1;
  l.consumed=false;
}
function addPurchase(st,{date,sessions,amount,note,kind}){
  const p={id:uid(),kind:kind||"buy",date:date||today(),sessions:+sessions||0,amount:+amount||0,note:note||""};
  st.purchases.push(p);
  st.remaining+=p.sessions;
  if(p.kind==="buy") st.totalPurchased+=p.sessions;
  return p;
}
function removePurchase(st,pid){
  const p=byId(st.purchases,pid); if(!p) return;
  st.remaining-=p.sessions;
  if(p.kind==="buy") st.totalPurchased-=p.sessions;
  st.purchases=st.purchases.filter(x=>x!==p);
}
function findConflicts(date,start,end,excludeId){
  const a=minutesOf(start),b=minutesOf(end);
  return S.lessons.filter(l=>l.status!=="cancelled"&&l.date===date&&String(l.id)!==String(excludeId)
    &&a<minutesOf(l.end)&&minutesOf(l.start)<b);
}
function rescheduleLesson(l,{date,start,end,reason}){
  l.changes.push({at:new Date().toISOString(),fromDate:l.date,fromStart:l.start,fromEnd:l.end,toDate:date,toStart:start,toEnd:end,reason:reason||""});
  l.date=date;l.start=start;l.end=end;
  // 時間變了：之前的提醒與預約確認作廢，需重新通知
  l.remindedAt="";l.changeNotifiedAt="";
}
function lastAttended(sid){
  const t=today();
  const ds=lessonsOf(sid).filter(l=>consumes(l.status)&&l.date<=t).map(l=>l.date);
  return ds.length?ds[ds.length-1]:null;
}
function nextLesson(sid){
  const t=today();
  return lessonsOf(sid).find(l=>l.status==="scheduled"&&l.date>=t&&!isPast(l))||null;
}
const hasLog = l=>!!(l.log.focus||l.log.feeling||l.log.coachNote||l.log.next||(l.log.exercises||[]).some(e=>e.name));
function exText(e){
  return e.name+(e.weight?` ${e.weight}kg`:"")+((e.sets||e.reps)?` ${e.sets||"?"}×${e.reps||"?"}`:"");
}
function lastLoggedExercises(sid,beforeId){
  const ls=lessonsOf(sid).filter(l=>String(l.id)!==String(beforeId)&&(l.log.exercises||[]).some(e=>e.name));
  return ls.length?ls[ls.length-1]:null;
}

let activeDialog=null, activeFinish=null;
function openSheet({title,body,confirmLabel="儲存",closeLabel="取消",onConfirm,extraFoot="",onMount,back,doneBack}){
  closeSheet();
  const scrim=document.createElement("div");scrim.className="scrim";
  scrim.innerHTML=`<dialog class="sheet" open aria-label="${esc(title)}">
    <div class="sheet-head"><span class="sheet-title">${esc(title)}</span><button class="btn btn-ghost btn-sm" type="button" data-close>關閉</button></div>
    <form class="sheet-body" id="sheet-form">${body}</form>
    <div class="sheet-foot">${extraFoot}<button class="btn" type="button" data-close>${esc(closeLabel)}</button>
    ${onConfirm?`<button class="btn btn-primary" type="button" data-confirm>${esc(confirmLabel)}</button>`:""}</div></dialog>`;
  document.body.appendChild(scrim);activeDialog=scrim;
  const finish=()=>{closeSheet();if(back)back()};
  activeFinish=finish;
  const form=$("#sheet-form",scrim);
  // doneBack：確認之後要回哪裡（沒給就跟取消一樣用 back）
  const confirm=()=>{
    if(onConfirm&&onConfirm(form,scrim)!==false){
      closeSheet();
      const next=doneBack!==undefined?doneBack:back;
      if(next)next();
    }
  };
  scrim.addEventListener("click",e=>{
    if(e.target===scrim||e.target.closest("[data-close]"))finish();
    else if(e.target.closest("[data-confirm]"))confirm();
  });
  form.addEventListener("submit",e=>{e.preventDefault();confirm()});
  if(onMount)onMount(scrim,form);
  return scrim;
}
function closeSheet(){if(activeDialog){activeDialog.remove();activeDialog=null;activeFinish=null}}

const isPrivate = l=>(l.kind||"private")==="private";
function lessonName(l){
  if(isPrivate(l)){const st=studentById(l.studentId);return st?st.name:"（已刪除的學員）"}
  return l.title||KINDS[l.kind].label;
}
const lessonColor = l=>isPrivate(l)?(studentById(l.studentId)?.color||"var(--muted)"):KINDS[l.kind].color;
/** 同類型、同名稱最近一次有填的金額（團課、樹科大預估用） */
function defaultAmount(l){
  const same=S.lessons.filter(x=>x.kind===l.kind&&x.title===l.title&&consumes(x.status)&&x.amount>0&&x.date<=today()).sort(cmpLesson);
  return same.length?same[same.length-1].amount:0;
}
/** 這堂的金額。私人課沒填就用學員單價；團課沒填，已上的算 0（要補填），預估才用上次金額 */
function amountOf(l,forecast){
  if(l.amount!==null&&l.amount!==undefined) return l.amount;
  if(isPrivate(l)){const st=studentById(l.studentId);return st?st.rate||0:0}
  return forecast?defaultAmount(l):0;
}
const lessonIncome = l=>consumes(l.status)?amountOf(l,false):0;
const expectedIncome = l=>consumes(l.status)?amountOf(l,false):(l.status==="scheduled"?amountOf(l,true):0);
const incomeRange = (a,b)=>S.lessons.filter(l=>l.date>=a&&l.date<=b).reduce((t,l)=>t+lessonIncome(l),0);
const expectedRange = (a,b)=>S.lessons.filter(l=>l.date>=a&&l.date<=b).reduce((t,l)=>t+expectedIncome(l),0);
const incomeOn = d=>incomeRange(d,d), expectedOn = d=>expectedRange(d,d);
function monthBounds(offset=0){

}

const ATT_COLORS={attended:"var(--good)",late:"var(--warn)",absent:"var(--crit)",scheduled:"var(--info)",cancelled:"var(--muted)"};
function donut(parts,centerLabel,aria){
  const total=parts.reduce((t,x)=>t+x.n,0);
  if(!total) return `<p class="empty">這段期間沒有資料。</p>`;
  let acc=0;const stops=[];const live=parts.filter(x=>x.n>0);
  live.forEach(x=>{const a=acc/total*100;acc+=x.n;const b=acc/total*100;
    stops.push(`${x.color} ${a}% ${live.length>1?Math.max(a,b-0.6):b}%`);if(live.length>1)stops.push(`var(--surface) ${Math.max(a,b-0.6)}% ${b}%`)});
  return `<div class="donut-wrap"><div class="donut" role="img" aria-label="${esc(aria||"")}" style="background:conic-gradient(${stops.join(",")})">
    <div class="donut-c"><b>${total}</b><span>${esc(centerLabel)}</span></div></div>
    <div class="legend">${parts.map(x=>`<div class="legend-row"><span class="sw" style="background:${x.color}"></span>${esc(x.label)}<span class="n">${x.n}</span><span class="pc">${Math.round(x.n/total*100)}%</span></div>`).join("")}</div></div>`;
}
function attendanceParts(a,b){
  const ls=S.lessons.filter(l=>l.date>=a&&l.date<=b);
  return Object.entries(STATUS).map(([k,m])=>({label:k==="scheduled"?"待上課":m.label,n:ls.filter(l=>l.status===k).length,color:ATT_COLORS[k]})).filter(x=>x.n>0||x.label!=="已取消");
}
function studentStatusParts(){

function logSummary(l){
  const g=l.log, parts=[];
  if(g.focus) parts.push("重點："+g.focus);
  const ex=(g.exercises||[]).filter(e=>e.name).map(exText);
  if(ex.length) parts.push("動作：\n  "+ex.join("\n  "));
  if(g.feeling) parts.push("學員狀況：\n  "+g.feeling.split("\n").join("\n  "));
  if(g.coachNote) parts.push("教練備註：\n  "+g.coachNote.split("\n").join("\n  "));
  if(g.next) parts.push("下次安排：\n  "+g.next.split("\n").join("\n  "));
  const ch=l.changes.map(c=>`改期：${mdLabel(c.fromDate)} ${c.fromStart} → ${mdLabel(c.toDate)} ${c.toStart}${c.reason?"（"+c.reason+"）":""}`);
  return esc([...parts,...ch].join("\n"));
}

function lessonSheet(l,{studentId="",date="",back}={}){
  const isNew=!l;
  const sels=activeStudents().filter(s=>s.status!=="paused"||String(s.id)===String(studentId)||(l&&String(s.id)===String(l.studentId)));
  const kind=isNew?(studentId||sels.length?"private":"group"):(l.kind||"private");
  const dur=isNew?+S.settings.duration||60:minutesOf(l.end)-minutesOf(l.start);
  openSheet({title:isNew?"排課":"編輯課程",back,body:`
    ${fSelect("kind","類型",Object.entries(KINDS).map(([k,v])=>[k,v.label]),kind)}
    <div data-for="private">${fSelect("studentId","學員",sels.map(s=>[s.id,s.packs===false?`${s.name}（單堂計費）`:`${s.name}（剩 ${s.remaining} 堂）`]),isNew?(studentId||(sels[0]&&sels[0].id)||""):l.studentId)}</div>
    <div data-for="other" hidden>${fText("title","課程名稱",l?l.title:"",{placeholder:"例：TRX、混合綜訓、樹德科大"})}</div>
    <div class="field-row">${fText("date","日期",isNew?(date||selectedDate):l.date,{type:"date",required:true})}${fText("start","開始時間",isNew?"09:00":l.start,{type:"time",required:true})}</div>
    ${fText("duration","時長（分鐘）",dur,{type:"number",step:"5"})}
    ${fText("amount","金額（元）",l&&l.amount!==null&&l.amount!==undefined?l.amount:"",{type:"number",hint:"私人課留空＝用學員單價；團課、樹科大出席後也可以再填"})}
    ${isNew?fSelect("weeks","重複",[[1,"只排這一堂"],[4,"固定每週，連續 4 週"],[8,"固定每週，連續 8 週"],[12,"固定每週，連續 12 週"]],1)
      +`<div data-for="wd" hidden><div class="field"><label style="display:block">每週上課日（可複選，例如週一＋週三）</label>
        <div class="wdchips">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="wd" value="${d}"><span>${WD[d]}</span></label>`).join("")}</div></div>
        <p class="hint">時間都是上面填的開始時間。某一天要換時間，排完後到那一堂按「改期」就好，其他週不受影響。</p></div>`:""}`,
    onMount:(scrim,form)=>{
      const wdBoxes=[...form.querySelectorAll('[name=wd]')];let wdTouched=false;
      const wdDefault=()=>{if(wdTouched||!wdBoxes.length)return;const dw=String(parseDay(form.elements.date.value||selectedDate).getDay());wdBoxes.forEach(b=>b.checked=b.value===dw)};
      wdBoxes.forEach(b=>b.addEventListener("change",()=>{wdTouched=true}));
      if(form.elements.date)form.elements.date.addEventListener("change",()=>{wdDefault()});
      if(form.elements.weeks)form.elements.weeks.addEventListener("change",()=>{const e=$('[data-for="wd"]',form);if(e)e.hidden=+form.elements.weeks.value<=1;wdDefault()});
      wdDefault();
      const sync=()=>{const p=form.elements.kind.value==="private";
        $('[data-for="private"]',form).hidden=!p;$('[data-for="other"]',form).hidden=p;
        if(!p&&!form.elements.title.value&&form.elements.kind.value==="school")form.elements.title.value="樹德科大";};
      form.elements.kind.addEventListener("change",sync);sync();
    },
    onConfirm:f=>{
      const kd=f.elements.kind.value, isP=kd==="private";
      const sid=isP?f.elements.studentId.value:"";
      if(isP&&!sid){toast("請選擇學員（沒有學員請先新增，或改選其他類型）");return false}
      const title=isP?"":(f.elements.title.value.trim()||KINDS[kd].label);
      const amtRaw=f.elements.amount.value.trim(), amount=amtRaw===""?null:(+amtRaw||0);
      const date=f.elements.date.value,start=f.elements.start.value;
      const d=Math.max(10,Math.min(480,+f.elements.duration.value||60));
      if(!date||!start){toast("請填日期與時間");return false}
      const end=timeOf(minutesOf(start)+d);
      const weeks=isNew?+f.elements.weeks.value:1;
      let dates=[date];
      if(isNew&&weeks>1){
        const picked=new Set([...f.querySelectorAll('[name=wd]:checked')].map(b=>+b.value));
        if(!picked.size){toast("請至少選一個每週上課日");return false}
        dates=[];for(let i=0;i<weeks*7;i++){const dd=addDays(parseDay(date),i);if(picked.has(dd.getDay()))dates.push(dayStr(dd))}
      }
      const clashes=dates.flatMap(ds=>findConflicts(ds,start,end,l?l.id:null).map(c=>({ds,c})));
      const apply=()=>{
        if(isNew){
          const now=new Date().toISOString();
          dates.forEach((ds,i)=>S.lessons.push({id:uid(),kind:kd,title,amount,studentId:sid,date:ds,start,end,status:"scheduled",consumed:false,
            log:{focus:"",exercises:[],feeling:"",coachNote:"",next:""},changes:[],
            confirmedAt:(isP&&i===0)?"":now,remindedAt:"",changeNotifiedAt:"",createdAt:now}));
          selectedDate=date;
          toast(dates.length>1?`已排 ${dates.length} 堂`:"已排課");
        }else{
          const moved=date!==l.date||start!==l.start||end!==l.end;
          if(moved) rescheduleLesson(l,{date,start,end,reason:""});
          const changedOwner=String(l.studentId)!==String(sid)||(l.kind||"private")!==kd;
          if(changedOwner) releaseLesson(l);
          l.kind=kd;l.title=title;l.amount=amount;l.studentId=sid;
          if(changedOwner) setLessonStatus(l,l.status);
          toast("已更新");
        }
        commit();
      };
      if(clashes.length){
        const names=[...new Set(clashes.map(x=>`${mdLabel(x.ds)} ${x.c.start}（${lessonName(x.c)}）`))].slice(0,3).join("、");
        confirmSheet("時間重疊",`這個時段跟既有的課重疊：${esc(names)}。要照樣排嗎？`,apply,"照樣排",back,back);
        return false;
      }
      apply();
    }});
}
function rescheduleSheet(l,back){
  const st=studentById(l.studentId);
  openSheet({title:"改期",back,confirmLabel:"確認改期",
    onMount:(scrim,form)=>{
      const prev=scrim.querySelector("#dayprev");
      const draw=()=>{const d=form.elements.date.value;if(!d){prev.textContent="";return}
        const ls=S.lessons.filter(x=>x.date===d&&x.status!=="cancelled"&&x.id!==l.id).sort(cmpLesson);
        prev.innerHTML=`<b>${fmtDate(d)}</b> 已有：`+(ls.length?ls.map(x=>`${esc(x.start)} ${esc(lessonName(x))}`).join("、"):"沒有其他課");};
      scrim.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>{
        form.elements.date.value=dayStr(addDays(parseDay(form.elements.date.value||l.date),+b.dataset.q));draw()}));
      form.elements.date.addEventListener("change",draw);draw();
    },

    <div class="seg" style="margin-bottom:8px"><button type="button" data-q="-1">前一天</button><button type="button" data-q="1">後一天</button><button type="button" data-q="7">下週同一天</button></div>
    <div class="field-row">${fText("date","新日期",l.date,{type:"date",required:true})}${fText("start","新開始時間",l.start,{type:"time",required:true})}</div>
    <div class="dayprev" id="dayprev"></div>
    ${fText("duration","時長（分鐘）",minutesOf(l.end)-minutesOf(l.start),{type:"number",step:"5"})}
    ${fText("reason","改期原因（選填）","",{placeholder:"例：學員 LINE 說臨時加班"})}
    <p class="hint">改期會保留歷史紀錄，並清除「已提醒」狀態，LINE 頁會出現改期通知。</p>`,
    onConfirm:f=>{
      const date=f.elements.date.value,start=f.elements.start.value;
      const d=Math.max(10,Math.min(480,+f.elements.duration.value||60));
      if(!date||!start){toast("請填日期與時間");return false}
      const end=timeOf(minutesOf(start)+d);
      if(date===l.date&&start===l.start&&end===l.end){toast("時間沒有變");return false}
      const reason=f.elements.reason.value.trim();
      const go=()=>{rescheduleLesson(l,{date,start,end,reason});
        if(l.status!=="scheduled") setLessonStatus(l,"scheduled");   // 改期後回到「已排定」，扣過的堂數會還回去
        commit();toast("已改期，LINE 頁有改期通知可以傳")};
      const cl=findConflicts(date,start,end,l.id);
      if(cl.length){confirmSheet("時間重疊",`新時段跟 ${cl.length} 堂課重疊，要照樣改嗎？`,go,"照樣改",back,back);return false}
      go();
    }});
}

function openLesson(id,back){

    <p class="hint" style="margin-top:0">${fmtDate(l.date)} ${l.start}–${l.end}　${isPrivate(l)?(st?remainPill(st):""):`<span class="pill pill-gold">${KINDS[l.kind].label}</span>`}${l.consumed?"　（這堂已扣 1 堂）":""}　金額 ${money(amountOf(l,true))}${l.amount===null||l.amount===undefined?"（預估）":""}</p>

          else if(!l.consumed&&wasC&&st) toast(`已還 1 堂，剩 ${st.remaining} 堂`);
          if(consumes(l.status)&&!isPrivate(l)&&(l.amount===null||l.amount===undefined)){amountSheet(l,()=>openLesson(id,back));return}
          openLesson(id,back);
        }
        else if(a==="log") logSheet(l,reopen);
        else if(a==="reschedule") rescheduleSheet(l,reopen);
        else if(a==="edit") lessonSheet(l,{back:reopen});

          ()=>{releaseLesson(l);gcTrash(l);S.lessons=S.lessons.filter(x=>x!==l);commit();toast("已刪除")},"刪除",reopen,back);
      });
    }});
}

/* ───────── 畫面：收入 ───────── */
function reviewBounds(offset=incomeOffset){
  if(incomeSpan==="year"){const y=new Date().getFullYear()+offset;return [`${y}-01-01`,`${y}-12-31`,`${y} 年`]}
  if(incomeSpan==="range"){
    const a=rangeFrom||monthBounds()[0], b=rangeTo||today();
    return a<=b?[a,b,`${mdLabel(a)} – ${mdLabel(b)}`]:[b,a,`${mdLabel(b)} – ${mdLabel(a)}`];
  }
  return monthBounds(offset);
}
function prevBounds(){
  if(incomeSpan==="range"){const [a,b]=reviewBounds();const n=Math.round((parseDay(b)-parseDay(a))/864e5)+1;
    return [dayStr(addDays(parseDay(a),-n)),dayStr(addDays(parseDay(a),-1))]}
  return reviewBounds(incomeOffset-1);
}
function deltaHtml(cur,prev){
  if(!prev) return "";
  const pct=Math.round((cur-prev)/prev*100);
  return `<span class="delta ${pct>=0?"up":"down"}">${pct>=0?"▲":"▼"} ${Math.abs(pct)}%（上期 ${money(prev)}）</span>`;
}

  const [a,b,label]=reviewBounds();

      ms.push({label:`${d.getMonth()+1} 月`,earned:incomeRange(f,e),expected:expectedRange(f,e)})}
    const max=Math.max(0,...ms.map(x=>x.expected));

    }).filter(x=>x.n);
    rows=days.length?days.map(x=>`<div class="row"><button type="button" class="row-main btn-plain" data-action="goto-day" data-value="${x.d}">
        <div class="row-title">${fmtDate(x.d)}</div><div class="row-sub">${x.n} 堂</div></button>
        <div class="row-end" style="flex-direction:column;align-items:flex-end;gap:0"><span class="mono">${money(x.earned)}</span>${x.expected>x.earned?`<span class="row-sub">預估 ${money(x.expected)}</span>`:""}</div></div>`).join(""):"";
  }

         <div class="field"><label for="rg-b">到</label><input id="rg-b" type="date" data-range="to" value="${b}"></div></div></section>`

        <button class="btn btn-sm" type="button" data-action="income-now">本${unit}</button>
        <button class="btn btn-sm" type="button" data-action="income-next">下一${unit} ›</button></div>`}
    <div class="tiles">

      ${tile({value:newSt,unit:"位",label:"新學員",note:"依第一次購買日"})}

    ${missing||unconfirmed?`<div class="note-box">${unconfirmed?`有 <b>${unconfirmed}</b> 堂時間已過、還沒標記出席，沒有計入收入（到「今日」頁確認）。`:""}${unconfirmed&&missing?"<br>":""}${missing?`有 <b>${missing}</b> 堂團課／外部課程已出席但還沒填金額。`:""}</div>`:""}
    <section class="card"><div class="sec-head"><h2 class="sec-title">${byMonth?"每月收入":"每日明細"}</h2><span class="sec-sub">${byMonth?"實心＝已收入，淡色＝預估":"點一天可跳到課表"}</span></div>
      ${rows||`<p class="empty">這段期間沒有課程。</p>`}</section>
    <section class="card"><div class="sec-head"><h2 class="sec-title">依課程類型</h2><span class="sec-sub">已收入／預估</span></div>
      ${kinds.length?kinds.map(x=>`<div class="row"><span class="dot" style="background:${KINDS[x.k].color}"></span>

        <div class="row-end" style="flex-direction:column;align-items:flex-end;gap:0"><span class="mono">${money(x.earned)}</span>${x.expected>x.earned?`<span class="row-sub">預估 ${money(x.expected)}</span>`:""}</div></div>`).join(""):`<p class="empty">這段期間沒有課程。</p>`}</section>

      ${perStudent.length?perStudent.map(x=>barRow(x.st.name,x.n,x.n,maxN,x.n+" 堂")).join(""):`<p class="empty">這段期間沒有私人課。</p>`}</section>
    <p class="hint">收入以「上課當天、標記出席」認列，跟你的月表「日收入」一樣；買課的金額不會重複計算。私人課沒填金額時用學員單價。</p>
  </div>`;
}

/* ───────── 畫面：LINE 提醒 ───────── */
function rangeBounds(){
  const t=parseDay(today());
  if(remindRange==="today") return [today(),today()];
  if(remindRange==="tomorrow"){const d=dayStr(addDays(t,1));return [d,d]}
  if(remindRange==="3days") return [today(),dayStr(addDays(t,3))];
  return [today(),dayStr(addDays(startOfWeek(t),6))];
}
function remindItems(){
  const t=today(), [a,b]=rangeBounds();
  const upcoming=S.lessons.filter(l=>isPrivate(l)&&l.studentId&&l.status==="scheduled"&&l.date>=t&&!isPast(l)).sort(cmpLesson);
  return {
    confirm:upcoming.filter(l=>!l.confirmedAt&&l.changes.length===0),
    remind:upcoming.filter(l=>l.date>=a&&l.date<=b),
    change:upcoming.filter(l=>l.changes.length&&!l.changeNotifiedAt),

async function gcFetch(path,{method="GET",body,params}={}){
  const q=params?"?"+new URLSearchParams(params).toString():"";
  for(let attempt=0;;attempt++){
    const r=await fetch(`${GC_API}${encodeURIComponent(gc().calendarId)}/${path}${q}`,{method,
      headers:{Authorization:"Bearer "+gcToken,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
    if(r.status===204)return {};
    let j={};try{j=await r.json()}catch(e){}
    if(r.ok)return j;
    const msg=(j.error&&j.error.message)||("HTTP "+r.status);
    if((r.status===429||(r.status===403&&/rate|quota/i.test(msg)))&&attempt<4){await gcSleep(1200*(attempt+1));continue}
    const err=new Error(msg);err.status=r.status;throw err;
  }
}

    if(!e.start||!e.start.dateTime||!e.end||!e.end.dateTime)continue;
    const s=gcParts(e.start.dateTime),en=gcParts(e.end.dateTime);
    // 只有「跟上次同步時不一樣」才算日曆上真的被改；否則只是自己上次寫入的回聲，不能蓋掉 App 還沒送出的修改
    const rk=`${s.date}|${s.time}|${en.time}`,cur=`${l.date}|${l.start}|${l.end}`,base=l.gcalAt||cur;
    if(rk!==base){
      if(rk!==cur){
        rescheduleLesson(l,{date:s.date,start:s.time,end:en.time,reason:"在 Google 日曆修改"});
        if(l.status!=="scheduled")setLessonStatus(l,"scheduled");
        applied++;
      }
      l.gcalAt=rk;l.gcalSig=gcSig(l);
    }
    l.gcalId=e.id;
  }
  c.syncToken=res.nst;
  return {applied,deleted};
}
async function gcPush(){
  const c=gc();let n=0;
  for(const id of c.trash.slice()){
    try{await gcFetch("events/"+id,{method:"DELETE"})}catch(e){if(e.status!==410&&e.status!==404)throw e}
    c.trash=c.trash.filter(x=>x!==id);n++;
  }
  const from=dayStr(addDays(new Date(),-14));
  for(const l of S.lessons){
    if(l.date<from)continue;
    if(l.status==="cancelled"){
      if(l.gcalId){try{await gcFetch("events/"+l.gcalId,{method:"DELETE"})}catch(e){if(e.status!==410&&e.status!==404)throw e}l.gcalId="";l.gcalSig="";n++}
      continue;
    }
    const sig=gcSig(l);
    if(l.gcalId&&l.gcalSig===sig)continue;
    const id=gcEventId(l.id),body=gcBody(l);
    try{await gcFetch("events",{method:"POST",body:{...body,id}})}
    catch(e){if(e.status===409)await gcFetch("events/"+id,{method:"PUT",body:{...body,id,status:"confirmed"}});else throw e}
    l.gcalId=id;l.gcalSig=sig;l.gcalAt=`${l.date}|${l.start}|${l.end}`;n++;
    await gcSleep(60);
  }
  return n;
}
async function gcSync({interactive=false,silent=false}={}){
  if(!gcReady()){if(!silent)toast("請先在「設定」填 Client ID 和日曆 ID");return}
  if(gcSyncing)return;

  try{
    if(!gcLive()){
      if(!interactive){gcStatus="需要重新連線，點「同步日曆」";return}
      await gcAuth();
    }
    const {applied,deleted}=await gcPull();
    if(deleted.length){const c=gc();c.pendingDel=[...new Set([...c.pendingDel,...deleted.map(l=>l.id)])]}
    const pushed=await gcPush();
    gc().lastSync=new Date().toISOString();gcStatus="";
    save();if(applied||pushed||deleted.length)render();
    if(interactive||!silent)toast(`同步完成：日曆改動 ${applied} 堂、送出 ${pushed} 筆`);
  }catch(e){
    if(e.status===401)gcToken="";
    gcStatus="同步失敗："+(e.status===401?"登入過期，請再按一次「同步日曆」":e.status===404?"找不到這個日曆，請檢查日曆 ID":e.message);
    if(interactive)toast(gcStatus);
  }finally{gcSyncing=false;gcUi();gcAskDeleted()}
}

/* ───────── 雲端同步（Firebase Firestore，兩支手機共用） ───────── */
const FB_V="10.14.1";
const FB_SET_KEYS=["studio","coach","duration","lowAt","absentConsumes","templates"];
const fbc=()=>{const c=S.settings.fb||(S.settings.fb={});if(!c.config)c.config={};if(!c.synced)c.synced={};if(c.linked===undefined)c.linked=false;if(c.hold===undefined)c.hold=0;return c};
let fb=null,fbLoading=null,fbPushTimer=null,fbRenderTimer=null,fbMsg="",fbListening=false;
const fbReady=()=>{const k=fbc().config;return !!(k.apiKey&&k.projectId&&k.appId)};
function stable(o){
  if(o===null||typeof o!=="object")return JSON.stringify(o===undefined?null:o);
  if(Array.isArray(o))return "["+o.map(stable).join(",")+"]";
  return "{"+Object.keys(o).sort().filter(k=>o[k]!==undefined).map(k=>JSON.stringify(k)+":"+stable(o[k])).join(",")+"}";
}
function hash53(str){
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function fbDoc(col,o){
  if(col==="meta"){const d={};FB_SET_KEYS.forEach(k=>{d[k]=S.settings[k]===undefined?null:S.settings[k]});return JSON.parse(JSON.stringify(d))}
  const d=JSON.parse(JSON.stringify(o));delete d._u;
  if(col==="lessons"){delete d.gcalId;delete d.gcalSig;delete d.gcalAt}   // 日曆連結是各手機自己的
  return d;
}
const fbHash=(col,o)=>hash53(stable(fbDoc(col,o)));
function fbStatusText(){
  if(!fbReady())return "尚未設定";
  if(fbMsg)return fbMsg;
  if(!fb||!fb.user)return "未登入";
  if(!fbc().linked)return "已登入，尚未連線資料";
  if(fbc().hold)return `已暫停：偵測到大量刪除（${fbc().hold} 筆），請到設定確認`;
  return "已連線・"+(fb.user.email||"");
}
function fbUi(){document.querySelectorAll("[data-fbstatus]").forEach(el=>{el.textContent=fbStatusText()})}
function fbRenderSoon(){clearTimeout(fbRenderTimer);fbRenderTimer=setTimeout(()=>render(),120)}
function fbLoad(){
  if(fb)return Promise.resolve(fb);
  if(fbLoading)return fbLoading;
  fbLoading=(async()=>{
    const sdk=window.__fbSdk||{
      app:await import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-app.js`),
      auth:await import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-auth.js`),
      fs:await import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-firestore.js`)};
    const app=sdk.app.initializeApp(fbc().config);
    const auth=sdk.auth.getAuth(app);
    let db;
    try{db=sdk.fs.initializeFirestore(app,{localCache:sdk.fs.persistentLocalCache({tabManager:sdk.fs.persistentMultipleTabManager()})})}
    catch(e){db=sdk.fs.initializeFirestore(app,{localCache:sdk.fs.memoryLocalCache()})}
    fb={sdk,app,auth,db,user:null,unsubs:[]};
    sdk.auth.onAuthStateChanged(auth,u=>{fb.user=u;fbUi();if(u&&fbc().linked)fbListenStart()});
    return fb;
  })().catch(e=>{fbLoading=null;throw e});
  return fbLoading;
}
function fbListenStart(){
  if(!fb||!fb.user||fbListening)return;fbListening=true;
  const {onSnapshot,collection,doc}=fb.sdk.fs,db=fb.db;
  const onErr=e=>{fbMsg="雲端讀取失敗："+(e&&e.code==="permission-denied"?"這個 Google 帳號不在允許名單，請換對的帳號登入":(e&&e.message)||"");fbUi()};
  ["students","lessons"].forEach(col=>fb.unsubs.push(onSnapshot(collection(db,col),snap=>fbApply(col,snap.docChanges()),onErr)));
  fb.unsubs.push(onSnapshot(doc(db,"meta","settings"),snap=>{if(snap.exists()&&!(snap.metadata&&snap.metadata.hasPendingWrites))fbApplySettings(snap.data())},onErr));
  fbMsg="";fbUi();
}
function fbStop(){if(fb){fb.unsubs.forEach(u=>{try{u()}catch(e){}});fb.unsubs=[]}fbListening=false}
function fbApply(col,changes){
  const c=fbc();let changed=false;
  changes.forEach(ch=>{
    if(ch.doc.metadata&&ch.doc.metadata.hasPendingWrites)return;                 // 自己剛寫出去的回聲
    const id=String(ch.doc.id),key=col+"/"+id,arr=col==="students"?S.students:S.lessons;
    const idx=arr.findIndex(x=>String(x.id)===id);
    if(ch.type==="removed"){if(idx>=0){arr.splice(idx,1);changed=true}delete c.synced[key];return}
    const raw=ch.doc.data();delete raw._u;raw.id=id;
    const n=col==="students"?normalize({students:[raw],lessons:[]}).students[0]:normalize({students:[],lessons:[raw]}).lessons[0];
    const hr=fbHash(col,n),cur=idx>=0?arr[idx]:null;
    if(cur){
      const hl=fbHash(col,cur);
      if(hl!==c.synced[key]&&hr!==c.synced[key])return;                          // 這支手機有還沒送出的修改，以這支為準（稍後會送出）
      if(hl===hr){c.synced[key]=hr;return}
      const keep=col==="lessons"?{gcalId:cur.gcalId,gcalSig:cur.gcalSig,gcalAt:cur.gcalAt}:{};
      Object.assign(cur,n,keep);
    }else arr.push(n);
    c.synced[key]=hr;changed=true;
  });
  if(changed){save();fbRenderSoon()}
}
function fbApplySettings(d){
  const c=fbc(),pick={};FB_SET_KEYS.forEach(k=>{pick[k]=d[k]===undefined?null:d[k]});
  const hr=hash53(stable(pick)),cur=fbHash("meta");
  if(c.synced["meta/settings"]!==cur&&hr!==c.synced["meta/settings"])return;
  if(hr===cur){c.synced["meta/settings"]=hr;return}
  FB_SET_KEYS.forEach(k=>{if(d[k]!==undefined&&d[k]!==null)S.settings[k]=d[k]});
  S.settings.templates={...DEFAULT_TEMPLATES,...(S.settings.templates||{})};
  c.synced["meta/settings"]=fbHash("meta");save();fbRenderSoon();
}
async function fbPush(force=false){
  if(!fb||!fb.user||!fbc().linked)return 0;
  const c=fbc(),{writeBatch,doc}=fb.sdk.fs,db=fb.db;
  const ops=[],seen=new Set(["meta/settings"]);
  const add=(col,o)=>{const key=col+"/"+o.id;seen.add(key);const h=fbHash(col,o);if(c.synced[key]!==h)ops.push({t:"set",col,id:String(o.id),d:fbDoc(col,o),key,h})};
  S.students.forEach(s=>add("students",s));S.lessons.forEach(l=>add("lessons",l));
  const mh=fbHash("meta");if(c.synced["meta/settings"]!==mh)ops.push({t:"set",col:"meta",id:"settings",d:fbDoc("meta"),key:"meta/settings",h:mh});
  Object.keys(c.synced).forEach(k=>{if(!seen.has(k)){const [col,id]=k.split("/");ops.push({t:"del",col,id,key:k})}});
  if(!ops.length){if(c.hold){c.hold=0;fbUi()}return 0}
  const dels=ops.filter(o=>o.t==="del").length,total=Object.keys(c.synced).length;
  if(!force&&dels>Math.max(5,total*0.5)){c.hold=dels;save();fbUi();return 0}      // 防呆：大量刪除先暫停，等人確認
  c.hold=0;const now=Date.now();
  for(let i=0;i<ops.length;i+=400){
    const part=ops.slice(i,i+400),b=writeBatch(db);
    part.forEach(o=>{const r=doc(db,o.col,o.id);if(o.t==="set")b.set(r,{...o.d,_u:now});else b.delete(r)});
    part.forEach(o=>{if(o.t==="set")c.synced[o.key]=o.h;else delete c.synced[o.key]});
    b.commit().then(()=>{if(fbMsg.startsWith("雲端寫入失敗")){fbMsg="";fbUi()}}).catch(e=>{
      fbMsg="雲端寫入失敗："+(e&&e.code==="permission-denied"?"沒有權限（這個 Google 帳號不在允許名單）":(e&&e.message)||"");
      part.forEach(o=>{delete c.synced[o.key]});fbUi()});
  }
  save();fbUi();return ops.length;
}
function fbSchedule(){

  clearTimeout(fbPushTimer);fbPushTimer=setTimeout(()=>fbPush(),1200);

function fbLink(replaceLocal){

function fbParseConfig(text){

  (String(text).match(/(\w+)\s*:\s*["']([^"']+)["']/g)||[]).forEach(p=>{const m=p.match(/(\w+)\s*:\s*["']([^"']+)["']/);if(m)cfg[m[1]]=m[2]});

    case "income-next": incomeOffset++; render(); break;
    case "income-now": incomeOffset=0; render(); break;
    case "goto-day": selectedDate=v; weekAnchor=v; tab="calendar"; render(); window.scrollTo(0,0); break;
    case "theme": S.settings.theme=v; commit(); break;
    case "reset-templates": confirmSheet("還原預設範本？","你修改過的訊息範本會被覆蓋。",()=>{S.settings.templates={...DEFAULT_TEMPLATES};commit()}); break;
    case "fb-connect": fbConnect(); break;
    case "fb-sync": if(!fb||!fb.user||!fbc().linked){toast("請先登入並連線")}else{const n=await fbPush();toast(n?`已送出 ${n} 筆變更`:fbc().hold?"已暫停，請先確認大量刪除":"沒有需要送出的變更")} break;
    case "fb-force": {const n=await fbPush(true);toast(`已同步 ${n} 筆`);render();break}
    case "fb-overwrite": fbOverwriteCloud(); break;
    case "fb-signout": fbSignOut(); break;
    case "gc-sync": gcSync({interactive:true}); break;
    case "gc-orphans": gcOrphans(); break;
    case "gc-disconnect": gcDisconnect(); break;
    case "export": await saveFile(`dtc-pt-backup-${today()}.json`,buildBackup()); break;
    case "copy-backup": toast((await copyText(buildBackup()))?"已複製備份文字，貼到記事本或傳給自己存好":"複製失敗，請改用匯出檔案"); break;
    case "import-file": $("#file-in").click(); break;
    case "paste-backup":
      openSheet({title:"貼上備份文字",confirmLabel:"下一步",body:`<div class="field"><textarea name="t" style="min-height:180px" placeholder="把備份文字貼在這裡"></textarea></div>`,
        onConfirm:f=>{const t=f.elements.t.value.trim();if(!t){toast("沒有內容");return false}setTimeout(()=>importText(t),0)}});
      break;
    case "seed": seed(); break;
    case "wipe-demo": confirmSheet("清除示範資料？","只會刪除標示為「示範」的學員與他們的課。",()=>{
      const ids=new Set(S.students.filter(s=>s.demo).map(s=>String(s.id)));
      S.students=S.students.filter(s=>!s.demo);S.lessons=S.lessons.filter(l=>!ids.has(String(l.studentId)));commit();toast("已清除")}); break;
    case "reset-all": confirmSheet("清空全部資料？","所有學員、課程、紀錄都會刪除，無法復原。建議先匯出備份。",()=>{S=blank();commit();toast("已清空")},"全部清空"); break;
  }
});
document.addEventListener("input",e=>{ if(e.target.id==="student-search") applySearch() });
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="file-in"){
    const f=t.files&&t.files[0]; if(!f) return;
    const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(f);t.value="";return;
  }
  if(t.dataset.fbconf!==undefined){
    const cfg=fbParseConfig(t.value);const k=["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"];
    const clean={};k.forEach(x=>{if(cfg[x])clean[x]=cfg[x]});
    if(!clean.apiKey||!clean.projectId||!clean.appId){toast("看不出 Firebase 設定，請整段 firebaseConfig 貼上");return}
    fbc().config=clean;fbStop();fb=null;fbLoading=null;fbc().linked=false;fbc().synced={};save();toast("已儲存 Firebase 設定，請按「登入並連線」");render();if(typeof fbLoad==="function")fbLoad().catch(()=>{});return;
  }
  if(t.dataset.gc){
    const c=gc(),k=t.dataset.gc,val=t.value.trim();
    if(c[k]!==val){c[k]=val;if(k==="calendarId"||k==="clientId"){c.syncToken="";c.pendingDel=[];S.lessons.forEach(l=>{l.gcalSig=""});if(k==="calendarId")S.lessons.forEach(l=>{l.gcalId=""})}}
    if(k==="clientId"){gcToken="";gcExpiry=0}
    save();gcUi();return;
  }
  if(t.dataset.range){ if(t.dataset.range==="from")rangeFrom=t.value;else rangeTo=t.value; render(); return; }
  if(t.dataset.setting){
    const k=t.dataset.setting;
    S.settings[k]=t.type==="checkbox"?t.checked:(t.hasAttribute("data-num")?(+t.value||0):t.value);
    save();toast("已儲存");
  }else if(t.dataset.tpl){S.settings.templates[t.dataset.tpl]=t.value;save();toast("範本已儲存")}
});
window.addEventListener("error",e=>{
  if(document.getElementById("fatal"))return;
  const d=document.createElement("div");d.id="fatal";
  d.style.cssText="position:fixed;inset:0;z-index:999;background:#FBF9F6;color:#221D16;padding:24px;overflow:auto;font:15px/1.6 sans-serif";
  d.innerHTML='<h1 style="font-size:18px">這頁沒能正常開起來</h1><pre style="white-space:pre-wrap;background:#F4F0E9;padding:12px;border-radius:10px;font-size:12px"></pre><button style="padding:8px 16px">重新載入</button>';
  $("pre",d).textContent=[e.message,BUILD,navigator.userAgent].join("\n");$("button",d).onclick=()=>location.reload();
  document.body.appendChild(d);
});
/* 開專用連結 #gc=<Client ID>|<日曆 ID>&fb=<firebaseConfig JSON> 時自動填入設定，然後把網址列清乾淨（設定不會留在公開的程式碼裡） */
(function(){
  try{
    if(!location.hash||location.hash.length<4)return;
    const P=new URLSearchParams(location.hash.slice(1));let msg=[];
    const g=P.get("gc");
    if(g){const [cid,cal]=g.split("|");
      if(cid&&cal&&/\.apps\.googleusercontent\.com$/.test(cid)){const c=gc();c.clientId=cid.trim();c.calendarId=cal.trim();c.syncToken="";S.lessons.forEach(l=>{l.gcalSig="";l.gcalId=""});msg.push("Google 日曆")}}
    const f=P.get("fb");
    if(f){const cfg=JSON.parse(f);if(cfg&&cfg.apiKey&&cfg.projectId&&cfg.appId){const c=fbc();c.config=cfg;c.linked=false;c.synced={};msg.push("雲端同步")}}
    if(msg.length){save();history.replaceState(null,"",location.pathname+location.search);
      setTimeout(()=>{if(typeof toast==="function")toast("已填入"+msg.join("、")+"設定，到「設定」按登入／同步")},400);
      if(fbReady())fbLoad().catch(()=>{})}
  }catch(e){}
})();
render();
</script>
</body>
</html>
